spring.application.name=pipes

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# JWT
pipes.jwt.secret=${JWT_SECRET}
pipes.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Executor
pipes.executor.core-pool-size=${EXECUTOR_CORE_POOL_SIZE:2}
pipes.executor.max-pool-size=${EXECUTOR_MAX_POOL_SIZE:4}
pipes.executor.queue-capacity=${EXECUTOR_QUEUE_CAPACITY:50}

# CORS
pipes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500}

# Static previews
pipes.preview.root=${PREVIEW_ROOT:./pipes-previews}

# Logging
logging.level.com.pipes=INFO
logging.level.org.springframework.security=WARN